name: Build videoCreator for Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      OPENCREATOR_DESKTOP_OFFICIAL_BUILD: '0'
      OPENCREATOR_DESKTOP_TARGET_PLATFORM: win32
      OPENCREATOR_DESKTOP_TARGET_ARCH: x64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/krillinai/go.mod
          cache-dependency-path: runtime/krillinai/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opencreator/protocol build
      - run: pnpm --filter @opencreator/config test
      - run: pnpm --filter @opencreator/desktop test -- test/deep-link-manager.test.ts test/protocol-path.test.ts test/updater.test.ts
      - run: pnpm --filter @opencreator/desktop test -- test/release-assets.test.mjs -t "videoCreator"
      - run: pnpm desktop:dist
      - name: Verify packaged application startup
        run: pnpm --filter @opencreator/desktop e2e:package:smoke
      - name: Upload installer and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: videoCreator-3.2.9-windows-x64
          if-no-files-found: error
          path: |
            apps/desktop/release/videoCreator-*.exe
            apps/desktop/release/opencreator-desktop-build-manifest.json
